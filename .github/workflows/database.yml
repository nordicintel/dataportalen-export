name: Rebuild database
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require completed JSONL
        run: |
          if [ ! -f data/datasets.jsonl.gz ]; then
            echo 'Missing data/datasets.jsonl.gz. Run the Harvest workflow first.' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Rebuild from JSONL
        run: /usr/bin/time -v uv run --no-dev python scripts/build_database.py
      - name: Publish database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.db.gz
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild SQLite download'
          git push origin "HEAD:$GITHUB_REF_NAME"
