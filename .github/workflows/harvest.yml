name: Harvest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refetch unchanged records
        type: boolean
        default: false
      recovery_run_id:
        description: Optional failed run whose source state should seed the first publication
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: catalog-harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check daily schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -m dataportalen_export.schedule --manual
          else
            python -m dataportalen_export.schedule
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.schedule.outputs.due == 'true'
        with:
          python-version: '3.13'
          enable-cache: true
      - if: steps.schedule.outputs.due == 'true'
        run: uv sync --locked --no-dev
      - name: Restore source state before first publication
        if: steps.schedule.outputs.due == 'true' && inputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          gh run download "$RECOVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name failed-harvest-state --dir "$RUNNER_TEMP/harvest-recovery"
          python - <<'PY'
          import json, os, shutil, tomllib
          from pathlib import Path
          config = tomllib.loads(Path('config.toml').read_text())
          output = Path(config.get('output', {}).get('directory', 'data'))
          if output.exists() and any(output.iterdir()):
              raise RuntimeError('Recovery requires an empty output directory; published products are never overwritten')
          recovery = Path(os.environ['RUNNER_TEMP']) / 'harvest-recovery'
          states = [p for name in ('source_records.jsonl.xz', 'source_records.jsonl.gz') for p in recovery.rglob(name)]
          if len(states) != 1:
              raise RuntimeError('Expected exactly one retained source-state file')
          output.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(states[0], output / states[0].name)
          raw = list(recovery.rglob('dataportal.rdf.gz'))
          if len(raw) == 1:
              (output / 'raw').mkdir()
              shutil.copyfile(raw[0], output / 'raw/dataportal.rdf.gz')
          (output / 'manifest.json').write_text(json.dumps({'schema_version': 0, 'status': 'unpublished-recovery'}) + '\n')
          PY
      - name: Harvest and validate products
        id: harvest
        if: steps.schedule.outputs.due == 'true'
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            /usr/bin/time -v uv run --no-dev python -m dataportalen_export --force
          else
            /usr/bin/time -v uv run --no-dev python -m dataportalen_export
          fi
      - name: Retain failed source state for diagnosis
        if: failure() && steps.harvest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-harvest-state
          path: |
            .export-*/data/source_records.jsonl.*
            .export-*/data/raw/dataportal.rdf.gz
            .export-*/data/catalog.db.*
            .export-*/data/catalog.duckdb.*
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
      - name: Record attempt and publish
        if: always() && steps.schedule.outputs.due == 'true'
        env:
          HARVEST_OUTCOME: ${{ steps.harvest.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, UTC
          from pathlib import Path
          Path('.github/last_attempt.json').write_text(json.dumps({
              'attempted_at': datetime.now(UTC).isoformat(),
              'outcome': os.environ['HARVEST_OUTCOME'],
          }, separators=(',', ':')) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last_attempt.json
          if [ "$HARVEST_OUTCOME" = 'success' ]; then
            git add data/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh current catalog exports'
          git push origin HEAD:main
      - name: Verify the next scheduled check skips today
        if: success() && steps.schedule.outputs.due == 'true'
        run: test "$(python -m dataportalen_export.schedule)" = 'due=false'
