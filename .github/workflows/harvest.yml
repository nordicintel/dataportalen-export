name: Harvest
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: "Europe/Stockholm"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check configured interval
        id: schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=''
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/datasets.jsonl.gz&sha=$GITHUB_REF_NAME&per_page=1" --jq '.[0].commit.committer.date // ""')
          fi
          python scripts/scrape.py --check-due --last-scrape "$last"
      - uses: astral-sh/setup-uv@v6
        if: steps.schedule.outputs.due == 'true'
        with:
          python-version: '3.13'
          enable-cache: true
      - if: steps.schedule.outputs.due == 'true'
        run: uv sync --locked --no-dev
      - name: Scrape complete JSONL
        id: scrape
        if: steps.schedule.outputs.due == 'true'
        run: /usr/bin/time -v uv run --no-dev python scripts/scrape.py
      - name: Extract optional URL hosts
        if: steps.schedule.outputs.due == 'true'
        run: uv run --no-dev python scripts/extract_hosts.py
      - name: Rebuild optional database
        id: database
        if: steps.schedule.outputs.due == 'true' && steps.schedule.outputs.database == 'true'
        run: /usr/bin/time -v uv run --no-dev python scripts/build_database.py
      - name: Publish completed downloads
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        env:
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/datasets.jsonl.gz
          if [ -f data/hosts.txt ]; then git add data/hosts.txt; fi
          if [ "$DATABASE_OUTCOME" = 'success' ]; then git add data/catalog.db.gz; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh dataset downloads'
          git push origin "HEAD:$GITHUB_REF_NAME"
