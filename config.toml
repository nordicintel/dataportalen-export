[scrape]
catalogs = []
countries = ["se"] # All catalogs tagged Sweden by data.europa.eu.
languages = ["sv", "en"] # Empty means keep all languages.
page_size = 500
max_attempts = 5
timeout_seconds = 120
retry_backoff_seconds = 1
page_delay_seconds = 0
gzip_level = 6
log_level = "INFO"

[schedule]
enabled = true
interval_days = 1
time = "06:00"
timezone = "Europe/Stockholm"

[database]
enabled = true
gzip_level = 6

[hosts]
enabled = true
