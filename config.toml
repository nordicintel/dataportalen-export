[schedule]
enabled = true
time = "06:00"
timezone = "Europe/Stockholm"

[sources]
dataportal = true
exclude_dataportal_contexts = ["104"]
dataeu = true
countries = ["se"]
exclude_eu_catalogs = ["oppnadata", "nsip-se"]

[harvest]
concurrency = 8
request_timeout_seconds = 60
download_timeout_seconds = 600
max_attempts = 5

[logging]
level = "INFO"
http_level = "WARNING"

[output]
directory = "data"
combined_jsonl = true
entity_jsonl = true
catalog_jsonl = true
sqlite = true
duckdb_memory_limit_mb = 512
parquet = true
jsonld = true
compression = "xz"
compression_level = 6
compression_threshold_mib = 95
