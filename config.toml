[scrape]
catalogs = ["oppnadata"]
countries = [] # Country IDs, e.g. ["se"]. Combined with catalogs as a union.
languages = ["sv", "en"] # Empty means keep all languages.
page_size = 500
max_attempts = 5
timeout_seconds = 120
retry_backoff_seconds = 1
page_delay_seconds = 0
gzip_level = 6
log_level = "INFO"

[schedule]
enabled = true
interval_days = 1
time = "06:00"
timezone = "Europe/Stockholm"

[database]
enabled = false
zstd_level = 6
