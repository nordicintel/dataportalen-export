[project]
name = "dataportalen-export"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "tldextract>=5.3,<6",
    "tzdata; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
