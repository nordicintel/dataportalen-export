[project]
name = "dataportalen-export"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "rdflib>=7,<8", "pydantic>=2,<3", "duckdb>=1.4,<2", "tzdata; sys_platform == 'win32'"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
